services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: secure_users_directory
      MYSQL_USER: bookstore
      MYSQL_PASSWORD: ${DB_PASSWORD:-bookstore}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "bookstore", "-p${DB_PASSWORD:-bookstore}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_USERNAME: bookstore
      DB_PASSWORD: ${DB_PASSWORD:-bookstore}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
