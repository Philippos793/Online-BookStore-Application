<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title})}">
    <title>Browse Books | SocialBookstore</title>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar('search')}"></nav>

<main>
    <header class="page-header">
        <div class="container">
            <h1>Find your next read</h1>
            <p>Search the books offered by the community by title and author.</p>
        </div>
    </header>

    <div class="container">
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <!-- Search form -->
        <div class="sb-card sb-card-body mb-4">
            <form th:action="@{/user/searchBooks}" th:object="${searchData}" method="post" class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label for="title" class="form-label">Title</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-book"></i></span>
                        <input type="text" id="title" th:field="*{title}" class="form-control" placeholder="e.g. Harry Potter">
                    </div>
                </div>
                <div class="col-md-4">
                    <label for="authors" class="form-label">Authors</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                        <input type="text" id="authors" name="authors" class="form-control" placeholder="Comma separated"
                               th:value="${searchData.authors != null ? #strings.listJoin(searchData.authors, ', ') : ''}">
                    </div>
                </div>
                <div class="col-md-3 d-grid">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-search me-1"></i> Search</button>
                </div>
                <div class="col-12">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="exactMatch" th:field="*{exactMatch}">
                        <label class="form-check-label" for="exactMatch">Exact title match</label>
                    </div>
                </div>
            </form>
        </div>

        <!-- Results -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="section-title mb-0" th:if="${searched}">
                <i class="bi bi-list-ul"></i> Search results
                <span class="chip ms-1" th:text="${#lists.size(books)}">0</span>
            </h2>
            <h2 class="section-title mb-0" th:unless="${searched}">
                <i class="bi bi-clock-history"></i> Recently added
            </h2>
            <a th:if="${searched}" th:href="@{/user/searchBooks}" class="small fw-semibold">
                <i class="bi bi-x-circle me-1"></i> Clear search
            </a>
        </div>

        <div th:if="${#lists.isEmpty(books)}" class="sb-card empty-state">
            <div class="empty-icon"><i class="bi bi-search"></i></div>
            <h5 th:text="${searched} ? 'No books found' : 'No books yet'">No books found</h5>
            <p th:if="${searched}">Try a shorter title, remove the author filter or turn off exact match.</p>
            <p th:unless="${searched}">Nobody has offered a book yet - why not be the first?</p>
            <a th:href="@{/user/addBookOffer}" class="btn btn-primary" th:unless="${searched}">Offer a book</a>
        </div>

        <div class="row g-4" th:unless="${#lists.isEmpty(books)}">
            <div class="col-sm-6 col-lg-4 col-xl-3" th:each="book : ${books}">
                <div th:replace="~{fragments/layout :: bookCard(${book}, 'request')}"></div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
