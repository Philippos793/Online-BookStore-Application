<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title})}">
    <title>My Books | SocialBookstore</title>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar('myBooks')}"></nav>

<main>
    <header class="page-header">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
            <div>
                <h1>My Books</h1>
                <p>
                    You are offering <strong th:text="${#lists.size(books)}">0</strong>
                    <span th:text="${#lists.size(books) == 1 ? 'book' : 'books'}">books</span> to the community.
                </p>
            </div>
            <a th:href="@{/user/addBookOffer}" class="btn btn-light px-4">
                <i class="bi bi-plus-lg me-1"></i> Offer a book
            </a>
        </div>
    </header>

    <div class="container">
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div th:if="${#lists.isEmpty(books)}" class="sb-card empty-state">
            <div class="empty-icon"><i class="bi bi-bookshelf"></i></div>
            <h5>Your shelf is empty</h5>
            <p>Add the books you have already read so other readers can request them.</p>
            <a th:href="@{/user/addBookOffer}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i> Offer your first book</a>
        </div>

        <div class="row g-4" th:unless="${#lists.isEmpty(books)}">
            <div class="col-sm-6 col-lg-4 col-xl-3" th:each="book : ${books}">
                <div th:replace="~{fragments/layout :: bookCard(${book}, 'remove')}"></div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
