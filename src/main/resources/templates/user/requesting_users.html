<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Requesting Users</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css">
</head>
<body>
<div class="container">
    <h2>Users Requesting Your Book</h2>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div th:if="${#lists.isEmpty(requestingUsers)}">
        <p>No users found.</p>
    </div>
    <div th:if="${!#lists.isEmpty(requestingUsers)}">
        <table class="table">
            <thead>
            <tr>
                <th>Username</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${requestingUsers}">
                <td th:text="${user.username}"></td>
                <td th:text="${user.fullName}"></td>
                <td th:text="${user.email}"></td>
                <td>
                    <form th:action="@{/user/acceptRequest}" method="post">
                        <input type="hidden" name="bookId" th:value="${bookId}" />
                        <input type="hidden" name="username" th:value="${user.username}" />
                        <button type="submit" class="btn btn-success">Accept</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
