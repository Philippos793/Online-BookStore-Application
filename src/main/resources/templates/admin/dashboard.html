<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title})}">
    <title>Admin | SocialBookstore</title>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar('admin')}"></nav>

<main>
    <header class="page-header">
        <div class="container">
            <h1><i class="bi bi-shield-lock me-2"></i>Admin dashboard</h1>
            <p>An overview of the SocialBookstore community.</p>
        </div>
    </header>

    <div class="container">
        <div class="row g-3 mb-4">
            <div class="col-6 col-lg-3">
                <div class="sb-card stat-card h-100">
                    <div class="stat-icon blue"><i class="bi bi-people"></i></div>
                    <div>
                        <div class="stat-value" th:text="${memberCount}">0</div>
                        <div class="stat-label">Members</div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="sb-card stat-card h-100">
                    <div class="stat-icon green"><i class="bi bi-book"></i></div>
                    <div>
                        <div class="stat-value" th:text="${bookCount}">0</div>
                        <div class="stat-label">Books offered</div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="sb-card stat-card h-100">
                    <div class="stat-icon orange"><i class="bi bi-person-lines-fill"></i></div>
                    <div>
                        <div class="stat-value" th:text="${authorCount}">0</div>
                        <div class="stat-label">Authors</div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="sb-card stat-card h-100">
                    <div class="stat-icon purple"><i class="bi bi-tags"></i></div>
                    <div>
                        <div class="stat-value" th:text="${categoryCount}">0</div>
                        <div class="stat-label">Categories</div>
                    </div>
                </div>
            </div>
        </div>

        <h2 class="section-title"><i class="bi bi-clock-history"></i> Latest books</h2>
        <div th:if="${#lists.isEmpty(recentBooks)}" class="sb-card empty-state">
            <div class="empty-icon"><i class="bi bi-book"></i></div>
            <h5>No books yet</h5>
            <p>Books offered by members will appear here.</p>
        </div>
        <div class="row g-3" th:unless="${#lists.isEmpty(recentBooks)}">
            <div class="col-sm-6 col-lg-3" th:each="book : ${recentBooks}">
                <div th:replace="~{fragments/layout :: bookCard(${book}, 'none')}"></div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
