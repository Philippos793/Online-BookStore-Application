#
# Local overrides (credentials etc.) - gitignored, see README
#
spring.config.import=optional:classpath:application-local.properties

#
# JDBC properties
#
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:secure_users_directory}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update

# Seed authors/categories from data.sql after Hibernate has created the tables
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

#
# Logging
#
logging.level.root=INFO
logging.level.socialbookstore=DEBUG

#
# Mail
#
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
